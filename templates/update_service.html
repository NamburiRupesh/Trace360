{% extends "base.html" %}

{% block title %}Trace360 | Update Service{% endblock %}

{% block content %}

<section class="auth-page">

    <div class="auth-header">

        <p class="eyebrow">
            UPDATE SERVICE RECORD
        </p>

        <h1>
            Update Service #{{ service.ServiceID }}
        </h1>

        <p>
            Product ID: {{ service.ProductID }}
        </p>

    </div>


    <div class="auth-card">

        {% if error %}

        <div class="error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST">

            <label>
                Service Type
            </label>

            <input
                type="text"
                name="service_type"
                value="{{ service.ServiceType }}"
                required
            >


            <label>
                Problem Reported
            </label>

            <textarea
                name="problem_reported"
                rows="3"
            >{{ service.ProblemReported or '' }}</textarea>


            <label>
                Diagnosis
            </label>

            <textarea
                name="diagnosis"
                rows="3"
            >{{ service.Diagnosis or '' }}</textarea>


            <label>
                Action Taken
            </label>

            <textarea
                name="action_taken"
                rows="3"
            >{{ service.ActionTaken or '' }}</textarea>


            <label>
                Remarks
            </label>

            <textarea
                name="remarks"
                rows="3"
            >{{ service.Remarks or '' }}</textarea>


            <label>
                Service Date
            </label>

            <input
                type="date"
                name="service_date"
                value="{{ service.ServiceDate }}"
                required
            >


            <label>
                Cost
            </label>

            <input
                type="number"
                step="0.01"
                name="cost"
                value="{{ service.Cost or '' }}"
            >


            <button
                type="submit"
                class="primary-button"
            >
                Update Service Record
            </button>

        </form>

    </div>

</section>

{% endblock %}
